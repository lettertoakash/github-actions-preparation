name: Parallel Jobs Practice

on:
  #push:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: First job message
        run: echo "First job is running"

      - name: Wait for 10 seconds
        run: sleep 10

  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Second job message
        run: echo "Second job is running"

      - name: Wait for 10 seconds
        run: sleep 10